# Configuration du service KyberDaemon
# Format: cle=valeur

listen_address = 0.0.0.0
# listen_address = 127.0.0.1      # recommandé si le daemon est exposé via un reverse proxy TLS
listen_port = 8443

# Chemins d'authentification / clés
auth_config = C:\ProgramData\KyberDaemon\auth.conf
keys_directory = C:\ProgramData\KyberDaemon\keys

# Limites
session_timeout_seconds = 1800
max_connections = 64
max_sessions_per_user = 4
strict_network_mode = false             # true => écoute uniquement sur 127.0.0.1 (reverse proxy conseillé)

# Logs
log_directory = logs
log_file_name = kyberd.log
log_max_size_mb = 20
log_max_files = 5

# Sécurité des clés serveurs
key_encryption_mode = dpapi          # dpapi (Windows) ou passphrase
key_encryption_passphrase = ChangeMe!Rotate123  # obligatoire si key_encryption_mode=passphrase
key_rotation_days = 90                   # 0 pour désactiver la rotation automatique

# Kerberos (optionnel)
kerberos_enabled = false
kerberos_keytab = config/kyberd.keytab
kerberos_service_principal = host/kyberd.local@EXAMPLE.COM
kerberos_replay_seconds = 300

# OAuth (optionnel)
oauth_enabled = false
oauth_issuer = https://login.example.com/
oauth_audience = api://kyberdaemon
oauth_jwks = config/oauth.jwks
oauth_required_scopes = kyberd.access
oauth_cache_seconds = 600

shell_path_windows = pwsh.exe
shell_args_windows = -NoLogo -NoProfile
shell_path_linux = /bin/bash
shell_args_linux = -i
